# live-config generates cory's SDDM autologin at boot. Its default Wayland
# session did not render on the tested emulated QEMU graphics adapters.
# Apply this runtime-only adjustment AFTER live-config, just before SDDM.
# The script is a no-op on installed systems and for any other user.
[Service]
ExecStartPre=/usr/local/lib/synapse/live-x11-session.py
