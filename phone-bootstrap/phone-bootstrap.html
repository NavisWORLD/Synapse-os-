<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>COSMOS // Phone Bootstrap</title>
<style>
  :root{color-scheme:dark;--bg:#05070c;--panel:#0c111b;--line:#263044;--text:#eef6ff;--muted:#8ea0b8;--ok:#75ffb1;--warn:#ffd878;--bad:#ff7d8d;--glow:#78b8ff}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#111c31 0,#05070c 48%);color:var(--text);font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}
  main{width:min(760px,100%);margin:auto;padding:22px 16px 60px}.eyebrow{letter-spacing:.16em;color:var(--glow);font-size:12px}.title{font-size:clamp(28px,8vw,48px);margin:4px 0 6px}.sub{color:var(--muted);margin-bottom:18px}.card{background:rgba(12,17,27,.9);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 18px 60px #0006}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.fields{display:grid;gap:10px}.label{font-size:11px;color:var(--muted);letter-spacing:.11em;text-transform:uppercase}.value{word-break:break-word}input{width:100%;background:#070b12;border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;font:inherit}button{border:1px solid #385176;background:#0e1828;color:var(--text);border-radius:13px;padding:13px 15px;font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}button.primary{background:#16365c;border-color:#4b87c7}button.install{background:#173d2d;border-color:#42a878}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.status{display:flex;align-items:center;gap:9px}.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);box-shadow:0 0 16px currentColor}.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}pre{white-space:pre-wrap;word-break:break-word;background:#05080e;border:1px solid #1d2635;border-radius:12px;padding:12px;max-height:280px;overflow:auto;color:#bcd2eb}.meter{height:9px;background:#060a10;border-radius:999px;overflow:hidden;border:1px solid #1c2839;margin-top:10px}.meter>div{height:100%;width:0;background:linear-gradient(90deg,#55b9ff,#75ffb1);transition:width .25s ease}.tiny{font-size:12px;color:var(--muted)}@media(max-width:560px){.actions{grid-template-columns:1fr}.row{grid-template-columns:1fr}.title{font-size:34px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">SYNAPSE OS // COSMOS</div>
  <h1 class="title">PHONE BOOTSTRAP</h1>
  <div class="sub">Local wired/network control surface. The laptop API performs the privileged work; this page only sends authenticated requests.</div>

  <section class="card fields">
    <div><div class="label">Laptop API</div><input id="base" value="" placeholder="http://synapse-os.local:8787"></div>
    <div><div class="label">Pairing token</div><input id="token" type="password" autocomplete="off" placeholder="paste token from laptop"></div>
    <div class="actions">
      <button class="primary" id="connect">CONNECT</button>
      <button id="hello" disabled>HEY, I'M HERE</button>
      <button class="install" id="install" disabled>INSTALL COSMOS</button>
    </div>
  </section>

  <section class="card">
    <div class="row"><div><div class="label">Link</div><div class="status"><span id="dot" class="dot"></span><span id="link">DISCONNECTED</span></div></div><div class="tiny" id="apiVersion"></div></div>
  </section>

  <section class="card">
    <div class="label">Connected laptop</div>
    <pre id="device">No device data yet.</pre>
  </section>

  <section class="card">
    <div class="row"><div><div class="label">Install job</div><div id="phase">IDLE</div></div><div id="pct">0%</div></div>
    <div class="meter"><div id="bar"></div></div>
    <pre id="installLog">Ready.</pre>
  </section>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const base = $('base'), token = $('token'), connect = $('connect'), hello = $('hello'), install = $('install');
  const dot = $('dot'), link = $('link'), device = $('device'), phase = $('phase'), pct = $('pct'), bar = $('bar'), installLog = $('installLog'), apiVersion = $('apiVersion');
  let timer = null;

  if (!base.value) base.value = location.protocol.startsWith('http') ? location.origin : 'http://synapse-os.local:8787';
  token.value = localStorage.getItem('synapse-phone-token') || '';

  function root(){ return base.value.trim().replace(/\/$/, ''); }
  function headers(){ return {'Content-Type':'application/json','X-Synapse-Token':token.value.trim()}; }
  async function call(path, options={}){
    const res = await fetch(root()+path, {...options, headers:{...headers(), ...(options.headers||{})}});
    const data = await res.json().catch(()=>({ok:false,error:`HTTP ${res.status}`}));
    if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }
  function setLink(state, text){ dot.className = 'dot '+state; link.textContent = text; }
  function fmtBytes(n){ if(n==null)return 'unknown'; const u=['B','KiB','MiB','GiB','TiB']; let i=0,v=n; while(v>=1024&&i<u.length-1){v/=1024;i++} return `${v.toFixed(i?1:0)} ${u[i]}`; }
  function renderDevice(d){
    const online = Object.entries(d.cosmos_ports||{}).filter(([,v])=>v).map(([p])=>p).join(', ') || 'none';
    const ips = (d.network||[]).map(x=>`${x.interface}: ${x.address}`).join('\n') || 'none';
    const hw = d.hardware || {};
    const profile = hw.profile_id || 'unverified';
    const certification = hw.certification_state || 'unverified';
    const hwid = hw.hwid || 'not exposed';
    device.textContent = `HOST      ${d.hostname}\nOS        ${d.os} ${d.os_release}\nKERNEL    ${d.kernel}\nARCH      ${hw.arch||d.machine}\nPROFILE   ${profile}\nCERT      ${certification}\nHWID      ${hwid}\nCPU       ${d.processor}\nCORES     ${d.cpu_logical}\nRAM       ${fmtBytes(d.memory_total_bytes)}\nDISK      ${fmtBytes(d.disk_root?.free_bytes)} free / ${fmtBytes(d.disk_root?.total_bytes)}\nBATTERY   ${d.battery_percent==null?'unknown':d.battery_percent+'%'}\nIP        ${ips}\nCOSMOS    listening ports: ${online}`;
    apiVersion.textContent = `API ${d.api_version||''}`;
  }
  function renderInstall(s){
    const p = Number(s.progress||0); phase.textContent = String(s.phase||'idle').toUpperCase(); pct.textContent = p+'%'; bar.style.width = Math.max(0,Math.min(100,p))+'%';
    installLog.textContent = [s.message, s.activation?`activation: ${s.activation}`:'', s.error?`error: ${s.error}`:'', s.checkout?`checkout: ${s.checkout}`:''].filter(Boolean).join('\n');
    dot.className = 'dot '+((s.phase==='failed')?'':((s.phase==='complete'||s.phase==='idle')?'ok':'busy'));
    if (['complete','failed','idle'].includes(s.phase)) install.disabled = false;
  }
  async function refreshStatus(){ try{ const r=await call('/v1/install/status'); renderInstall(r.install); }catch(e){ installLog.textContent=e.message; } }

  connect.onclick = async () => {
    try{
      setLink('busy','CONNECTING');
      const health = await fetch(root()+'/v1/health').then(r=>r.json());
      if(!health.ok) throw new Error('bootstrap API health check failed');
      localStorage.setItem('synapse-phone-token',token.value.trim());
      const r = await call('/v1/device'); renderDevice(r.device); setLink('ok','CONNECTED // LAPTOP VERIFIED');
      hello.disabled=false; install.disabled=false; await refreshStatus();
      if(timer)clearInterval(timer); timer=setInterval(refreshStatus,1500);
    }catch(e){ setLink('','CONNECTION FAILED'); device.textContent=e.message; hello.disabled=true; install.disabled=true; }
  };
  hello.onclick = async () => { try{ const r=await call('/v1/hello',{method:'POST',body:JSON.stringify({message:"hey, I'm here"})}); installLog.textContent=`PHONE: hey, I'm here\nLAPTOP: ${r.reply}\nHOST: ${r.hostname}`; }catch(e){installLog.textContent=e.message;} };
  install.onclick = async () => {
    if(!confirm('Install/update COSMOS on the connected laptop and activate supported services? Existing dirty checkouts are preserved.')) return;
    try{ install.disabled=true; const r=await call('/v1/install/start',{method:'POST',body:'{}'}); renderInstall(r.install); }catch(e){ install.disabled=false; installLog.textContent=e.message; }
  };
})();
</script>
</body>
</html>
