# Synapse OS live-media GRUB entrypoint.
# live-build replaces KERNEL_LIVE / INITRD_LIVE / APPEND_* placeholders.
set default=0
set timeout=4

if loadfont unicode ; then
  set gfxmode=auto
  insmod all_video
  insmod gfxterm
  terminal_output gfxterm
fi

if [ -e /boot/grub/live-theme/theme.txt ]; then
  set theme=/boot/grub/live-theme/theme.txt
  export theme
else
  set menu_color_normal=light-cyan/black
  set menu_color_highlight=white/blue
fi

menuentry "SYNAPSE OS // NEBULA // LIVE" --hotkey=s {
  linux KERNEL_LIVE APPEND_LIVE
  initrd INITRD_LIVE
}

menuentry "SYNAPSE OS // GENESIS // GATED INSTALLER" --hotkey=g {
  linux KERNEL_LIVE LB_BOOTAPPEND_LIVE_FAILSAFE
  initrd INITRD_LIVE
}

submenu "SYNAPSE // ADVANCED" {
  LINUX_LIVE
  MEMTEST
}
