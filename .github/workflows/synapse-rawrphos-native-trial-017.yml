name: Genuine RAWRPHOS native CPU evolution proposal probe

on:
  push:
    branches: [experiment/synapse-rawrphos-native-trial-017]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synapse-rawrphos-native-017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-native-proposal-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict independent static and source-protection gates
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m py_compile scripts/real_rawrphos_event_count_trial.py
          python3 -m unittest discover -s tests -p test_real_rawrphos_event_count_trial.py -v
          python3 -m unittest discover -s tests -p test_evolution.py -v
          python3 -m unittest discover -s tests -p test_debugger_model_assisted_reset.py -v
      - name: Acquire exact public native inference source (not a substitute model)
        run: |
          set -Eeuo pipefail
          git init -q "$RUNNER_TEMP/pinned-beast-source"
          git -C "$RUNNER_TEMP/pinned-beast-source" remote add origin 'https://github.com/NavisWORLD/The-beast-box-.git'
          git -C "$RUNNER_TEMP/pinned-beast-source" -c protocol.version=2 fetch -q --depth 1 origin 4054d675c4ef85d1343890f2e956dbc2fe88b2e6
          git -C "$RUNNER_TEMP/pinned-beast-source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-beast-source" rev-parse HEAD)" = '4054d675c4ef85d1343890f2e956dbc2fe88b2e6'
      - name: Install pinned CPU-only inference dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check 'torch==2.6.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check 'numpy==2.1.3' 'tokenizers==0.21.1' 'safetensors==0.5.3'
          python3 -m pip install --no-deps -e "$RUNNER_TEMP/pinned-beast-source/models/rawrphos"
      - name: Verify immutable 12K published CPU checkpoint and safely unpack
        env:
          RAW_BASE: https://github.com/NavisWORLD/The-beast-box-/releases/download/rawrphos-native-step-00012000-run-35819774878
          RAW_ARCHIVE_SHA: c956ba605f1194587c73f471103d97d86c496b89f943380fb480862f4df60613
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/rawrphos-source-archive" "$RUNNER_TEMP/native-checkpoint"
          curl --fail --location --retry 2 --max-time 180 -o "$RUNNER_TEMP/rawrphos-source-archive/checkpoint.tar.gz" "$RAW_BASE/rawrphos-native-step-00012000.tar.gz"
          printf '%s  %s\n' "$RAW_ARCHIVE_SHA" "$RUNNER_TEMP/rawrphos-source-archive/checkpoint.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'rawrphos-source-archive/checkpoint.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              if len(members) > 30 or sum(m.size for m in members) > 256_000_000:
                  raise RuntimeError('unexpected checkpoint archive capacity')
              for item in members:
                  path = pathlib.PurePosixPath(item.name)
                  if (path.is_absolute() or '..' in path.parts or not item.isfile() and not item.isdir()
                      or '\\' in item.name):
                      raise RuntimeError('unsafe checkpoint entry')
              archive.extractall(root/'native-checkpoint', filter='data')
          found = list((root/'native-checkpoint').rglob('manifest.json'))
          if len(found) != 1 or found[0].parent.name != 'step-00012000':
              raise RuntimeError('unexpected native checkpoint layout')
          (root/'native-checkpoint-path.txt').write_text(str(found[0].parent))
          PY
      - name: Run genuine RAWRPHOS CPU outputs with strict fail-closed staging
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -Eeuo pipefail
          python3 scripts/real_rawrphos_event_count_trial.py \
            --repo . \
            --checkpoint "$(cat "$RUNNER_TEMP/native-checkpoint-path.txt")" \
            --output "$RUNNER_TEMP/rawrphos-real-model-evidence"
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'rawrphos-real-model-evidence'
          verdict=json.loads((root/'TRIAL_VERDICT.json').read_text())
          assert verdict['candidate_staged'] is True
          assert verdict['raw_model_turns'] in (1,2)
          assert verdict['vm_result']=='NOT_RUN'
          assert verdict['production_modified'] is False
          assert (root/'PATCH_REVIEW.diff').stat().st_size > 0
          print('ACTUAL_RAWRPHOS_ONE_LINE_STAGED_VM_NOT_RUN')
          PY
      - name: Preserve actual outputs, rejections, or accepted SHA-bound diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-genuine-rawrphos-cpu-proposal-017
          path: ${{ runner.temp }}/rawrphos-real-model-evidence/
          if-no-files-found: warn
          retention-days: 21
