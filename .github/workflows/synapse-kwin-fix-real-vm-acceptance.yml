name: Synapse KWin repair real VM acceptance
on:
  workflow_dispatch:
  push:
    branches: [demo/synapse-kwin-fix-real-vm-001]
permissions:
  actions: read
  contents: read
jobs:
  real-gui-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download exact candidate ISO from PR verification
        uses: actions/download-artifact@v4
        with:
          name: synapse-os-nebula-amd64
          path: /tmp/synapse-iso
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: NavisWORLD/Synapse-os-
          run-id: 36074587062
      - name: Install real virtual display and capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-gui xorriso xvfb ffmpeg xdotool
      - name: Verify exact candidate ISO before boot
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /tmp/synapse-iso
          ISO="$(find . -maxdepth 1 -type f -name 'SynapseOS-*-amd64.iso' -print -quit)"
          test -s "$ISO"
          EXPECTED="$(awk '{print $1}' ./*.iso.sha256)"
          ACTUAL="$(sha256sum "$ISO" | awk '{print $1}')"
          test "$EXPECTED" = "$ACTUAL"
          mkdir -p /tmp/synapse-video
          xorriso -osirrox on -indev "$ISO" -extract /live/vmlinuz /tmp/synapse-video/vmlinuz
          xorriso -osirrox on -indev "$ISO" -extract /live/initrd.img /tmp/synapse-video/initrd.img
          xorriso -osirrox on -indev "$ISO" -extract /synapse-genesis/manifest.json /tmp/synapse-video/genesis-manifest.json
          echo "ISO checksum verified: $ACTUAL"
          cat /tmp/synapse-video/genesis-manifest.json
          echo "ISO_FILE=$PWD/$ISO" >> "$GITHUB_ENV"
      - name: Record actual QEMU live boot and desktop attempts
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/synapse-cosmic-vm-evidence"
          mkdir -p "$EVIDENCE"
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp > "$EVIDENCE/xvfb.log" 2>&1 &
          XVFB_PID=$!
          sleep 3
          DISPLAY=:99 ffmpeg -nostdin -loglevel error -y \
            -f x11grab -draw_mouse 1 -framerate 10 -video_size 1280x720 -i :99.0 \
            -c:v libx264 -preset ultrafast -crf 28 -pix_fmt yuv420p \
            "$EVIDENCE/SYNAPSE_COSMIC_REAL_VM.mp4" > "$EVIDENCE/recorder.log" 2>&1 &
          REC_PID=$!
          DISPLAY=:99 qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu qemu64 -smp 2 -m 6144 \
            -kernel /tmp/synapse-video/vmlinuz -initrd /tmp/synapse-video/initrd.img \
            -append 'boot=live components live-media=/dev/vda hostname=synapse-os username=cory locales=en_US.UTF-8 keyboard-layouts=us console=tty0 console=ttyS0,115200n8 systemd.unit=graphical.target systemd.show_status=1 plymouth.enable=0 systemd.journald.forward_to_console=1' \
            -drive "file=$ISO_FILE,format=raw,if=virtio,readonly=on" \
            -nic user,model=virtio-net-pci \
            -vga virtio -display gtk,gl=off -full-screen \
            -serial "file:$EVIDENCE/guest-serial.log" -monitor "unix:/tmp/synapse-hmp.sock,server,nowait" -no-reboot \
            > "$EVIDENCE/qemu.log" 2>&1 &
          VM_PID=$!
          capture() {
            local name="$1"
            DISPLAY=:99 ffmpeg -nostdin -loglevel error -y -f x11grab \
              -video_size 1280x720 -i :99.0 -frames:v 1 "$EVIDENCE/$name.png" \
              >> "$EVIDENCE/screenshots.log" 2>&1 || true
          }
          # All input below is injected directly into the guest through
          # QEMU HMP; host xdotool was only hovering the GTK viewport.
          guest() {
            python3 scripts/vm_guest_input.py /tmp/synapse-hmp.sock "$@" \
              >> "$EVIDENCE/input-monitor.log" 2>&1
          }
          sleep 325
          capture 00-kde-first-run
          guest key alt-f4
          sleep 12
          capture 01-real-desktop
          guest key alt-f2
          sleep 4
          guest type konsole
          sleep 4
          capture 02-terminal-launch-request
          guest key ret
          sleep 22
          capture 03-terminal-open
          guest type 'synapse status'
          guest key ret
          sleep 14
          capture 04-synapse-status
          guest type 'synapse doctor'
          guest key ret
          sleep 14
          capture 05-synapse-doctor
          guest key alt-f2
          sleep 3
          guest type synapse-control
          guest key ret
          sleep 18
          capture 06-synapse-control
          guest key alt-f2
          sleep 3
          guest type dolphin
          guest key ret
          sleep 18
          capture 07-file-manager
          guest key alt-f2
          sleep 3
          guest type synapse-beastos-web
          guest key ret
          sleep 25
          capture 08-beastos
          kill "$VM_PID" 2>/dev/null || true
          wait "$VM_PID" 2>/dev/null || true
          kill -INT "$REC_PID" 2>/dev/null || true
          wait "$REC_PID" 2>/dev/null || true
          kill "$XVFB_PID" 2>/dev/null || true
          test -s "$EVIDENCE/SYNAPSE_COSMIC_REAL_VM.mp4"
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$EVIDENCE/SYNAPSE_COSMIC_REAL_VM.mp4" > "$EVIDENCE/VIDEO_METRICS.txt"
          cp /tmp/synapse-iso/*.iso.sha256 "$EVIDENCE/ISO_SHA256.txt"
          cp /tmp/synapse-video/genesis-manifest.json "$EVIDENCE/GENESIS_MANIFEST.json"
          printf 'candidate_build_run=36074587062\nrecording_commit=%s\nvm_mode=real QEMU direct-kernel read-only candidate live ISO\nscreenshots=attempts; functional GUI requires independent inspection\n' "$GITHUB_SHA" > "$EVIDENCE/PROVENANCE.txt"
          if grep -q 'SYNAPSE_LIVE_GUI:selected Plasma X11' "$EVIDENCE/guest-serial.log"; then echo 'guest_x11_override=OBSERVED' >> "$EVIDENCE/PROVENANCE.txt"; else echo 'guest_x11_override=NOT_OBSERVED' >> "$EVIDENCE/PROVENANCE.txt"; fi
          sha256sum "$EVIDENCE/SYNAPSE_COSMIC_REAL_VM.mp4" > "$EVIDENCE/VIDEO_SHA256.txt"
          # The prior real VM recording had a KWin OpenGL freeze and abort.
          # Do not turn that known failure into a green video job.
          if grep -Eqi 'Freeze in OpenGL initialization detected|kwin_x11.*SIGABRT' "$EVIDENCE/guest-serial.log"; then
            echo "FAIL: KWin OpenGL crash recurred in candidate" | tee "$EVIDENCE/GUI_VERDICT.txt"
            exit 1
          fi
          echo "NO KNOWN KWIN OPENGL FREEZE OBSERVED; visible apps require manual review" > "$EVIDENCE/GUI_VERDICT.txt"
      - name: Upload actual video, screenshots and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-kwin-fix-real-gui
          path: synapse-cosmic-vm-evidence/
          retention-days: 30
          if-no-files-found: warn
