name: Experimental architecture VM gate

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Architecture to build and boot
        required: true
        type: choice
        options:
          - arm64
          - riscv64

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SYNAPSE_ARCH: ${{ inputs.architecture }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binfmt-support qemu-user-static qemu-system-arm qemu-system-misc \
            cpio debootstrap rsync xorriso squashfs-tools curl \
            build-essential cmake ninja-build rustc cargo

      - name: Install Debian 13 live-build and archive keyring
        run: |
          curl -fsSL -o /tmp/debian-archive-keyring.deb \
            'https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb'
          echo '9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  /tmp/debian-archive-keyring.deb' | sha256sum -c -
          curl -fsSL -o /tmp/live-build.deb \
            'https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb'
          echo '58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb' | sha256sum -c -
          sudo dpkg -i /tmp/debian-archive-keyring.deb /tmp/live-build.deb
          lb --version

      - name: Validate architecture configuration
        run: |
          python3 scripts/arch_matrix.py validate
          SYNAPSE_DRY_RUN=1 ./build/build.sh

      - name: Validate portable SDK source
        run: make check

      - name: Build experimental Synapse OS image
        run: sudo env SYNAPSE_ARCH="$SYNAPSE_ARCH" ./build/build.sh

      - name: Verify image checksum
        run: sha256sum -c out/*.iso.sha256

      - name: Boot experimental image in QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -name "SynapseOS-*-${SYNAPSE_ARCH}.iso" -print -quit)"
          test -n "$ISO"
          SYNAPSE_QEMU_LOG="/tmp/synapse-vm/${SYNAPSE_ARCH}.serial.log" bash scripts/qemu-smoke.sh "$SYNAPSE_ARCH" "$ISO"

      - name: Preserve diagnostics and image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-${{ inputs.architecture }}-promotion-evidence
          path: |
            /tmp/synapse-vm/*.serial.log
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: warn
