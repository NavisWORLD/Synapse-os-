name: Distinct real pinned 0.5B coder opt-in trace proposal

on:
  push:
    branches: [experiment/synapse-coder-trace-improvement-008]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-model-one-statement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Review strict source-transformation gates without model inference
        env:
          PYTHONPATH: src:.
        run: |
          python3 -m py_compile scripts/real_model_trace_improvement.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          # Extract only this script's pure reviewed transformation before
          # adding model dependencies; no evaluation of untrusted replies.
          module = ast.parse(Path("scripts/real_model_trace_improvement.py").read_text())
          assert sum(isinstance(n, ast.FunctionDef) and n.name=="package" for n in module.body)==1
          print("STATIC_STAGING_GATE_READY")
          PY
      - name: Install public CPU-only model dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check 'torch==2.6.0+cpu'             --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check             'transformers==4.52.4' 'huggingface_hub==0.31.4' 'safetensors==0.5.3'
      - name: Run ONE genuine pinned Qwen2.5-Coder-0.5B model turn and fail-closed stage gate
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
          HF_HOME: ${{ runner.temp }}/hf-coder-0p5b
        run: |
          set -Eeuo pipefail
          python3 scripts/real_model_trace_improvement.py --repo .             --output "$RUNNER_TEMP/trace-model-evidence"
          python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ["RUNNER_TEMP"])/"trace-model-evidence"
          x=json.loads((d/"RESULT.json").read_text())
          assert x["real_inference_completed"]
          assert x["production_modified"] is False
          print("REAL_TRACE_TRIAL_OUTCOME:", x["outcome"])
          if x["candidate_staged"]:
              assert (d/"RECEIPT.json").is_file()
              print("MODEL_BOUND_PATCH_STAGED_FOR_REVIEW_ONLY")
          else:
              print("MODEL_OUTPUT_REJECTED_WITHOUT_FABRICATING_PATCH")
          PY
      - name: Preserve actual reply, hash-bound proposal and verdict, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-real-qwen-coder-trace-evidence
          path: ${{ runner.temp }}/trace-model-evidence/
          if-no-files-found: warn
          retention-days: 14
