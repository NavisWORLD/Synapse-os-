name: Build and VM smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install host build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio debootstrap rsync xorriso squashfs-tools qemu-system-x86 curl

      - name: Install Debian 13 live-build and archive keyring
        run: |
          curl -fsSL -o /tmp/debian-archive-keyring.deb \
            'https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb'
          echo '9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  /tmp/debian-archive-keyring.deb' | sha256sum -c -
          curl -fsSL -o /tmp/live-build.deb \
            'https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb'
          echo '58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb' | sha256sum -c -
          sudo dpkg -i /tmp/debian-archive-keyring.deb /tmp/live-build.deb
          lb --version

      - name: Validate source
        run: make check

      - name: Build Synapse OS ISO
        run: sudo ./build/build.sh

      - name: Verify ISO checksum
        run: sha256sum -c out/*.iso.sha256

      - name: Verify generated live filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -name 'SynapseOS-*.iso' -print -quit)"
          test -n "$ISO"
          mkdir -p /tmp/synapse-image /tmp/synapse-root
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs /tmp/synapse-image/filesystem.squashfs
          unsquashfs -f -d /tmp/synapse-root /tmp/synapse-image/filesystem.squashfs \
            etc/os-release \
            etc/systemd/system/synapse-agent.service \
            usr/local/bin/synapse \
            usr/local/bin/synapse-control \
            usr/bin/plasmashell \
            usr/bin/calamares \
            usr/bin/pipewire \
            usr/bin/nmcli \
            usr/lib/synapse/python/synapse/__init__.py \
            usr/share/wallpapers/SynapseOS/contents/images/3840x2160.svg \
            usr/share/sddm/themes/synapse-nebula/Main.qml \
            usr/share/plymouth/themes/synapse-nebula/synapse-nebula.plymouth \
            usr/share/grub/themes/synapse-nebula/theme.txt
          grep -q '^ID=synapseos$' /tmp/synapse-root/etc/os-release
          test -s /tmp/synapse-root/etc/systemd/system/synapse-agent.service
          test -s /tmp/synapse-root/usr/local/bin/synapse
          test -s /tmp/synapse-root/usr/local/bin/synapse-control
          test -e /tmp/synapse-root/usr/bin/plasmashell
          test -e /tmp/synapse-root/usr/bin/calamares
          test -e /tmp/synapse-root/usr/bin/pipewire
          test -e /tmp/synapse-root/usr/bin/nmcli
          test -s /tmp/synapse-root/usr/lib/synapse/python/synapse/__init__.py
          test -s /tmp/synapse-root/usr/share/wallpapers/SynapseOS/contents/images/3840x2160.svg
          grep -q 'SYNAPSE OS' /tmp/synapse-root/usr/share/sddm/themes/synapse-nebula/Main.qml
          grep -q 'Synapse Nebula' /tmp/synapse-root/usr/share/plymouth/themes/synapse-nebula/synapse-nebula.plymouth
          grep -q 'SYNAPSE OS' /tmp/synapse-root/usr/share/grub/themes/synapse-nebula/theme.txt

      - name: Boot live ISO in QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -name 'SynapseOS-*.iso' -print -quit)"
          test -n "$ISO"
          mkdir -p /tmp/synapse-vm
          xorriso -osirrox on -indev "$ISO" -extract /live/vmlinuz /tmp/synapse-vm/vmlinuz
          xorriso -osirrox on -indev "$ISO" -extract /live/initrd.img /tmp/synapse-vm/initrd.img
          : > /tmp/synapse-vm/serial.log
          qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -smp 2 -m 4096 \
            -kernel /tmp/synapse-vm/vmlinuz \
            -initrd /tmp/synapse-vm/initrd.img \
            -drive file="$ISO",format=raw,if=virtio,readonly=on \
            -append 'boot=live components live-media=/dev/vda console=ttyS0 systemd.unit=multi-user.target systemd.show_status=1 systemd.log_target=console synapse.vmtest=1' \
            -nic user,model=virtio-net-pci \
            -display none \
            -serial file:/tmp/synapse-vm/serial.log \
            -no-reboot &
          VM_PID=$!
          result=timeout
          for _ in $(seq 1 240); do
            if grep -q 'SYNAPSE_VM_READY' /tmp/synapse-vm/serial.log 2>/dev/null; then
              result=pass
              break
            fi
            if grep -q 'SYNAPSE_VM_FAIL:' /tmp/synapse-vm/serial.log 2>/dev/null; then
              result=guest-fail
              break
            fi
            if ! kill -0 "$VM_PID" 2>/dev/null; then
              result=stopped
              break
            fi
            sleep 1
          done
          kill "$VM_PID" 2>/dev/null || true
          wait "$VM_PID" 2>/dev/null || true
          cat /tmp/synapse-vm/serial.log || true
          echo "QEMU result: $result"
          test "$result" = pass

      - name: Preserve VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-vm-diagnostics
          path: /tmp/synapse-vm/serial.log
          if-no-files-found: warn

      - name: Preserve ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-os-nebula-amd64
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: warn
