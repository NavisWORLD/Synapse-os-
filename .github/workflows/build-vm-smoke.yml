name: Build and VM smoke test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: synapse-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build rustc cargo
      - name: Validate source, SDKs, architecture registry
        run: make check

  build-and-boot-amd64:
    needs: source-validation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install host build and VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio debootstrap rsync xorriso squashfs-tools qemu-system-x86 curl

      - name: Install Debian 13 live-build and archive keyring
        run: |
          curl -fsSL -o /tmp/debian-archive-keyring.deb \
            'https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb'
          echo '9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  /tmp/debian-archive-keyring.deb' | sha256sum -c -
          curl -fsSL -o /tmp/live-build.deb \
            'https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb'
          echo '58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4  /tmp/live-build.deb' | sha256sum -c -
          sudo dpkg -i /tmp/debian-archive-keyring.deb /tmp/live-build.deb
          lb --version

      - name: Build Synapse OS amd64 ISO
        run: sudo env SYNAPSE_ARCH=amd64 ./build/build.sh

      - name: Verify ISO checksum
        run: sha256sum -c out/*.iso.sha256

      - name: Verify generated live filesystem and GENESIS payload
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -name 'SynapseOS-*-amd64.iso' -print -quit)"
          test -n "$ISO"
          grep -a -q 'synapse.genesis=1' "$ISO"
          mkdir -p /tmp/synapse-image /tmp/synapse-root
          xorriso -osirrox on -indev "$ISO" -extract /live/filesystem.squashfs /tmp/synapse-image/filesystem.squashfs
          xorriso -osirrox on -indev "$ISO" -extract /synapse-genesis/manifest.json /tmp/synapse-image/genesis-manifest.json
          unsquashfs -f -d /tmp/synapse-root /tmp/synapse-image/filesystem.squashfs \
            etc/os-release \
            etc/systemd/system/synapse-agent.service \
            usr/local/bin/synapse \
            usr/local/bin/synapse-control \
            usr/local/bin/synapse-genesis-writer \
            usr/bin/plasmashell \
            usr/bin/calamares \
            usr/bin/pipewire \
            usr/bin/nmcli \
            usr/lib/systemd/system/synapse-genesis-installer-api.service \
            usr/lib/synapse/python/synapse/__init__.py \
            usr/lib/synapse/python/synapse/hardware.py \
            usr/lib/synapse/python/synapse/genesis.py \
            usr/lib/synapse/python/synapse/genesis_runtime.py \
            usr/lib/synapse/python/synapse/genesis_writer.py \
            usr/include/synapse/synapse.h \
            usr/share/synapse/hardware/profiles.json \
            usr/share/synapse/phone-bootstrap.html \
            usr/share/synapse/GENESIS.html \
            usr/share/doc/synapse-os/LICENSE \
            usr/share/doc/synapse-os/NOTICE \
            usr/share/doc/synapse-os/COMMERCIAL-LICENSING.md \
            usr/share/doc/synapse-os/LICENSE-HISTORY.md \
            usr/share/doc/synapse-os/PROVENANCE.md \
            usr/share/doc/synapse-os/CITATION.cff \
            usr/share/doc/synapse-os/TRADEMARKS.md \
            usr/share/doc/synapse-os/THIRD_PARTY_NOTICES.md \
            usr/share/wallpapers/SynapseOS/contents/images/3840x2160.svg \
            usr/share/sddm/themes/synapse-nebula/Main.qml \
            usr/share/plymouth/themes/synapse-nebula/synapse-nebula.plymouth \
            usr/share/grub/themes/synapse-nebula/theme.txt
          grep -q '^ID=synapseos$' /tmp/synapse-root/etc/os-release
          test -s /tmp/synapse-root/usr/lib/synapse/python/synapse/hardware.py
          test -s /tmp/synapse-root/usr/lib/synapse/python/synapse/genesis.py
          test -s /tmp/synapse-root/usr/lib/synapse/python/synapse/genesis_runtime.py
          test -s /tmp/synapse-root/usr/lib/synapse/python/synapse/genesis_writer.py
          test -s /tmp/synapse-root/usr/include/synapse/synapse.h
          test -s /tmp/synapse-root/usr/share/synapse/hardware/profiles.json
          test -s /tmp/synapse-root/usr/share/synapse/phone-bootstrap.html
          test -s /tmp/synapse-root/usr/share/synapse/GENESIS.html
          test -s /tmp/synapse-root/usr/local/bin/synapse-genesis-writer
          test -s /tmp/synapse-root/usr/lib/systemd/system/synapse-genesis-installer-api.service
          test -s /tmp/synapse-image/genesis-manifest.json
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/LICENSE
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/NOTICE
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/COMMERCIAL-LICENSING.md
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/LICENSE-HISTORY.md
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/PROVENANCE.md
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/CITATION.cff
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/TRADEMARKS.md
          test -s /tmp/synapse-root/usr/share/doc/synapse-os/THIRD_PARTY_NOTICES.md
          grep -q 'Cory Davis / NavisWORLD Synapse Source License 1.0' /tmp/synapse-root/usr/share/doc/synapse-os/LICENSE
          grep -q '10.5281/zenodo.17574447' /tmp/synapse-root/usr/share/doc/synapse-os/PROVENANCE.md
          grep -q '10.5281/zenodo.17574447' /tmp/synapse-root/usr/share/doc/synapse-os/CITATION.cff
          grep -q '10.5281/zenodo.17574447' /tmp/synapse-image/genesis-manifest.json
          grep -q 'Cory Davis / NavisWORLD Synapse Source License 1.0' /tmp/synapse-image/genesis-manifest.json
          grep -q 'ConditionKernelCommandLine=synapse.genesis=1' /tmp/synapse-root/usr/lib/systemd/system/synapse-genesis-installer-api.service
          grep -q 'ConditionPathExists=/run/live/medium/synapse-genesis/manifest.json' /tmp/synapse-root/usr/lib/systemd/system/synapse-genesis-installer-api.service
          grep -q 'HOLD TO INSTALL SYNAPSE OS' /tmp/synapse-root/usr/share/synapse/GENESIS.html
          grep -q '/v2/install/arm' /tmp/synapse-root/usr/share/synapse/GENESIS.html
          grep -q '/v2/install/start' /tmp/synapse-root/usr/share/synapse/GENESIS.html
          python3 scripts/genesis_manifest.py verify \
            --manifest /tmp/synapse-image/genesis-manifest.json \
            --image /tmp/synapse-image/filesystem.squashfs
          unsquashfs -ll /tmp/synapse-image/filesystem.squashfs | grep 'libsynapse_abi\.so' >/dev/null
          grep -q 'SYNAPSE OS' /tmp/synapse-root/usr/share/sddm/themes/synapse-nebula/Main.qml
          grep -q 'Synapse Nebula' /tmp/synapse-root/usr/share/plymouth/themes/synapse-nebula/synapse-nebula.plymouth
          grep -q 'SYNAPSE OS' /tmp/synapse-root/usr/share/grub/themes/synapse-nebula/theme.txt

      - name: Boot amd64 live ISO in QEMU
        shell: bash
        run: |
          set -Eeuo pipefail
          ISO="$(find out -maxdepth 1 -name 'SynapseOS-*-amd64.iso' -print -quit)"
          test -n "$ISO"
          SYNAPSE_QEMU_LOG=/tmp/synapse-vm/serial.log bash scripts/qemu-smoke.sh amd64 "$ISO"

      - name: Preserve VM diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-vm-diagnostics-amd64
          path: /tmp/synapse-vm/serial.log
          if-no-files-found: warn

      - name: Preserve ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-os-nebula-amd64
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: warn
