name: Real RAWRPHOS 12K CPU evolution proposal trial

on:
  push:
    branches: [experiment/synapse-rawrphos-real-proposal-003]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-native-model-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin the native-model code independently from Synapse
        run: |
          set -Eeuo pipefail
          git clone --quiet --depth 1 \
            https://github.com/NavisWORLD/The-beast-box-.git "$RUNNER_TEMP/rawrphos-source"
          git -C "$RUNNER_TEMP/rawrphos-source" fetch --quiet --depth 1 origin \
            3d5743cba7c343f319971280049a0ed23fbc9596
          git -C "$RUNNER_TEMP/rawrphos-source" checkout --quiet --detach \
            3d5743cba7c343f319971280049a0ed23fbc9596
          test -s "$RUNNER_TEMP/rawrphos-source/models/rawrphos/scripts/install_pinned_12k.py"
          grep -q 'c956ba605f1194587c73f471103d97d86c496b89f943380fb480862f4df60613' \
            "$RUNNER_TEMP/rawrphos-source/models/rawrphos/scripts/install_pinned_12k.py"
      - name: Install CPU-only native model dependencies
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check 'torch==2.6.0+cpu' \
            --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check \
            'numpy==2.1.3' 'tokenizers==0.21.0' 'safetensors==0.5.3'
      - name: Fetch and verify pinned real native 12K checkpoint
        env:
          PYTHONPATH: ${{ runner.temp }}/rawrphos-source/models
        run: |
          set -Eeuo pipefail
          python3 -m rawrphos.scripts.install_pinned_12k \
            --destination "$RUNNER_TEMP/rawrphos-checkpoint"
          python3 -m rawrphos.inference.cli \
            --checkpoint "$RUNNER_TEMP/rawrphos-checkpoint" \
            --expected-sha256 339fb8e1d6f3950e2aa15a6e33bf8c0f28dd655cefc93b7926fb7545e7e97601 \
            info > "$RUNNER_TEMP/rawrphos-identity.json"
      - name: Perform ONE actual native-model CPU inference
        env:
          PYTHONPATH: src:.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          python3 scripts/rawrphos_real_evolution_probe.py \
            --beast-source "$RUNNER_TEMP/rawrphos-source" \
            --checkpoint "$RUNNER_TEMP/rawrphos-checkpoint" \
            --repo . --evidence "$RUNNER_TEMP/real-model-evidence"
          cp "$RUNNER_TEMP/rawrphos-identity.json" \
            "$RUNNER_TEMP/real-model-evidence/MODEL_IDENTITY.json"
      - name: Preserve model receipts, including honest failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synapse-real-rawrphos12k-proposal-trial
          path: ${{ runner.temp }}/real-model-evidence/
          if-no-files-found: warn
          retention-days: 14
