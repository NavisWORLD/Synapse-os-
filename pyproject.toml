[project]
name = "synapse-os-control"
version = "0.2.0a1"
description = "Synapse OS local control plane and Synapse Flow language runtime"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
synapse = "synapse.cli:main"
synflow = "synapse.flow_cli:main"
synlsp = "synapse.lsp:serve"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
