[project]
name = "synapse-os-control"
version = "0.2.1a1"
description = "Synapse OS local control plane, Synapse Flow runtime, and guarded USB writer"
requires-python = ">=3.11"
license = {text = "Cory Davis / NavisWORLD Synapse Source License 1.0"}

[project.scripts]
synapse = "synapse.cli:main"
synflow = "synapse.flow_cli:main"
synlsp = "synapse.lsp:serve"
synapse-usb = "synapse.usb_writer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
